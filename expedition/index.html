[choice('greenhouse','先看看温室里的积水','greenhouse','沿着小沟，寻找水排不出去的原因'),choice('light','先走近提灯的人','guardian','沿桥边的小路过去，别惊动它')],
[['fionn','这次可能不是地图错了。']]);
node('greenhouse','greenhouse','薄荷的根还泡在水里',
'推开温室门，一阵潮湿的草叶气味迎面而来。木架腿上结着白色盐痕，几只花盆已经浮了起来。希莱斯卷起袖子，把歪倒的种植盘托回高处。\n你顺着小沟拨开落叶，出口其实是通的。水缓缓流出去，又被下游更高的水位顶了回来。\n靠窗的架子下压着一只旧铁盒。水尚未漫到那里。盒盖上画着一株长了笑脸的薄荷，你记住了位置，先没有翻动它。',
[choice('trace','顺着水路，查看桥头的灯','after_greenhouse','弄清下游为什么一直蓄着水')],
[['potion-maker','光清理门口没有用。下游的水退不下去，根就一直泡着。'],['fionn','风车旁有一道闸门。我们去那里看看。']]);
node('guardian','guardian','回来几位？',
'桥头站着一只小小的苔石守卫，身高刚到菲恩胸口。它两脚陷在软泥里，手臂却稳稳托着一盏旧灯。\n灯没有灯芯。一只小灯蛾蜷在里面，翅膀微微发亮，每隔很久才动一下。\n守卫把灯举向你们。它的声音像两块被雨磨圆的石头轻轻相碰。\n“回来几位？”\n你说，你们是来找薄荷的。守卫停了一会儿，又低头看了看桥柱上的木牌。\n“名字不在这里。”',
[choice('list','蹲下来，看它守着的名单','waiting','木牌上有六道勾，第七行被盐霜盖住了')]);
node('waiting','guardian','留给最后一个人',
'木牌上的名字已经模糊了。你辨出第五行写着“米娅”，旁边有一个歪歪的勾；第七行被厚厚的盐霜遮住，只露出一笔很浅的划痕。\n牌子最上方写着一句话：人齐了，就熄灯，跟大家回家。\n守卫抬手指了指桥下的低路。那条路贴着水面，通向早已空下来的渡口。\n“留给最后一个人。”\n它把灯转向低路，仿佛你们已经问完了所有问题。',
[choice('wait','问问它，已经等了多久','shoulders','它肩头的苔藓里长着两丛薄荷')],
[['fionn','还有一个人，没回来？']]);
node('shoulders','guardian','别摘',
'“从什么时候开始等的？”你问。\n守卫没有回答。希莱斯的目光落在它肩上：两丛荧光薄荷扎根在浅浅的泥窝里，长得有些歪，叶尖泛白。\n他刚伸出手，守卫便向后缩了一点。灯罩发出轻轻一声响。\n“别摘。”\n希莱斯停住，摊开空着的手。\n守卫看了看他，又看了看自己的肩膀，过了一会儿才说：\n“米娅种的。她说，不要淹着。”',
[choice('water','一起查看闸门与低路','after_guardian','先找到能保住薄荷、也能保住等待的办法')],
[['potion-maker','不摘。我只想看看，根有没有泡坏。']]);
node('sluice','device','开闸，就会淹掉那条路',
'风车已经停转，闸门的手柄却还能转动。菲恩沿两边石槽走了一圈，在图上画出水流：开闸以后，温室的积水会流进月池，但桥下那条低路也会被淹没。\n他才碰到手柄，守卫就走过来，缓慢而坚决地挡在前面。它没有举拳，只把灯抱紧了。\n“那个人要走这里。”\n雨点开始敲打风车的叶片。你们现在知道水为什么不退了，却没办法直接把闸门打开。',
[choice('box','回温室，找找留下来的记录','box','那只画着薄荷笑脸的铁盒，还在窗边')],
[['fionn','我们先不动。……你们记得温室里的盒子吗？']]);
node('box','greenhouse','一只没有带走的铁盒',
'温室里的水又高了一点。你扶住木架，希莱斯俯身把铁盒取出来。盖子锈住了，他用布垫着，试了几次才打开。\n里面有几包受潮的种子，一小截黄色蜡笔，还有一本边角卷起的本子。第一页写着“米娅的种植记录”，日期是三年前。\n纸页粘在一起。你们把它放在干燥的架子上，一页一页慢慢分开。',
[choice('daily','先读薄荷旁边的小字','diary','字写得很认真，几处被泥手印盖住'),choice('drawing','先翻开夹着黄色蜡笔的那页','drawing_first','纸上画着一排手拉手的小人')]);
node('diary','greenhouse','它今天也帮忙了',
'“今天风很大，它帮我举着晒种子的布，一直举到吃饭。它说它不用吃饭，可是我也给它留了一个位置。”\n下面几行写得比前面大：\n“我给它种了两盆头发！它一直说痒。我说是肩膀，不是头发，它还是很高兴。”\n菲恩看看画里的薄荷，又望向窗外。桥头的灯仍然亮着。\n后一页记着一次涨水：“大家要搬去高地。它说，等人齐了就来。”纸边被水泡得透亮，后面的日期读不清了。',
[choice('picture','展开最后一张画','drawing','那一排小人旁边，还站着一个石头做的身影')]);
node('drawing_first','greenhouse','纸上也有七盏灯',
'你小心展开夹着蜡笔的纸。一排歪歪扭扭的小人，每个人手里都有一盏黄色的灯。\n六个人旁边，还画着一个方方的石头身影，肩上长着两丛绿草。它的手被画得很大，正牵着最小的女孩。\n希莱斯翻了翻前面的记录，读到女孩给守卫在饭桌边留位置、在它肩上种薄荷的小事。那句“等人齐了就来”，写在三年前搬去高地的那一页。',
[choice('caption','读出画下面的那句话','drawing','米娅把“七个”描了两遍')]);
node('drawing','greenhouse','我们家一共七个',
'画下面写着：\n“我们家一共七个。谁也不能落下。”\n菲恩用指尖沿着那排小人一个个数过去。数到最后，手指停在石头身影上。\n你忽然明白了木牌上空着的那一行。\n第七个人从来没有困在路的另一头。它一直站在这里，举着灯，替所有人等自己回家。\n雨水顺着玻璃往下淌。希莱斯把画托起来，等纸上的水滴落干净。',
[choice('show','把米娅的画带给守卫','refusal','让它看看，画里的第七个是谁')],
[['fionn','它把自己……漏掉了。']]);
node('refusal','guardian','我是守门人',
'你把画展开在灯旁，指给它看六个人，也指给它看那个长着薄荷的石头身影。\n守卫的目光停了一下，却很快移回低路。\n“我是守门人。要等人齐。”\n菲恩说，米娅已经把它画进去了。守卫不再看画，只用拇指慢慢擦着灯罩上同一块旧水痕。\n希莱斯没有继续解释。他把守卫肩头垂进积水的一根枝条轻轻托高。守卫这一次没有躲。\n“她说，不要淹着。”',
[choice('shelter','先替它和薄荷挡一挡雨','rain','有些事，知道答案也不等于立刻能放下')]);
node('rain','guardian','水正在上涨',
'雨忽然密起来。温室里传来一声闷响，一只泡软的木箱散了。希莱斯赶回去，把滑入水中的薄荷一盘盘托上高架；你帮忙扶住架子，袖口很快湿透。\n等你们回来，低路已只剩窄窄的一条脊。守卫把灯举得更高，自己却站得更低了。\n菲恩吸了一口气，像是要说“不会有人来了”。话到嘴边，他看见守卫肩上的两丛薄荷，又停住了。\n你把米娅的画收进防水袋。现在必须做些什么，但把灯抢走，或者重复一遍答案，都不能让它愿意离开。',
[choice('keep_light','告诉它：灯可以继续亮着','promise','我们一起换个不会被水淹到的地方等')]);
node('promise','guardian','好。灯留着',
'“不用熄灯。”你说，“我们把它带到高处，好不好？”\n守卫第一次抬头看你。\n菲恩把湿地图摊在一块石头上，用掌心护着纸。高坡上的旧旅店屋顶还在，门前有一段高于水面的石路。从那里望出去，能看见渡口。\n“她会找到吗？”守卫问。\n菲恩没有立刻点头。他看看地图，又看看雨里的路。',
[choice('check','先亲自确认去高处的路','highroad','答应带它走以前，先把路走清楚')],
[['fionn','我去看看。路口留标记，桥边也留。不能只在图上画一条线。'],['potion-maker','我留在这里。你们看好脚下。']]);
node('highroad','marks','一条真正能走的路',
'你和菲恩沿高坡走了一段。雨把土路冲出浅沟，旧旅店的屋檐仍完好，石阶却有一处被倒下的枝条遮住。\n菲恩没有用笔把整条路线一口气描实。他把未确认的转弯留空，和你商量先查哪一处。\n你们需要带着一个脚步缓慢、仍可能回头的守卫走过这里。图画得漂亮并不能代替这段路。',
[choice('steps','一起搬开石阶上的断枝','steps','先把守卫要踏过的路清出来'),choice('markers','先核对雾里容易错过的路口','markers','让后来的人也能顺着标记找到灯')]);
node('steps','marks','先腾出落脚的地方',
'菲恩托起断枝的一头，你把卡在石缝里的另一头慢慢移开。下面的石阶完整，只是覆着湿叶。\n你们清出一段能并肩通过的地方，再一起核对剩下的转弯。菲恩这才把路线描实，在旁边写下“今夜检查，雨中可行”。\n折返时，你在桥头留下箭头；菲恩在每个转弯补上相同的标记。那些箭头都朝着高处。',
[choice('return','带着确认过的路线回到桥头','handover','告诉守卫，灯会被带到哪里')]);
node('markers','marks','给后来的人留下方向',
'第一个岔口的旧路牌已经歪向低地。你扶正木杆，菲恩在背面补上朝高处的箭头，再退远几步，确认雨里仍看得清。\n你们沿标记走到旧旅店，顺手清开石阶上的断枝。菲恩把整条走过的路描实，旁边写下“今夜检查，雨中可行”。\n回到桥头，你又留下一块标记。米娅如果来到这里，会看见灯去了哪个方向。',
[choice('return','把桥头的箭头指给守卫看','handover','这次有实际走过的路，也有留下的指引')]);
node('handover','guardian','把灯交给我吧',
'你向守卫伸出手。它看着你的掌心，没有动。\n你把高处的屋顶指给它看，又让它看桥边的新箭头。灯罩里的小灯蛾动了动，微弱的光落在守卫石头做的指缝里。\n过了很久，它的手松开一点，又收紧了一点。你仍然伸着手，等它自己决定。',
[choice('carry','“我替你提着。你跟紧我。”','firststep','接过灯，先替它走出第一步'),choice('together','“灯在哪儿，我们就一起去哪儿。”','firststep','等它把灯交来，再和它并肩走')]);
node('firststep','guardian','跟上',
'灯的重量落进你的手心，比你想象中轻。守卫却像刚放下一块背了很久的石头，空着的两只手一时不知道该放在哪里。\n你往高路走了一步，回头举了举灯。\n“跟上。”\n石脚从软泥里拔出来，发出一声轻响。守卫低头看看留下的脚印，再慢慢迈出第二步。\n希莱斯护着它肩上的薄荷，菲恩走在前面，停在每个已经标好的转弯处等你们。旧旅店的屋檐越来越近。',
[choice('settle','把灯安放在高处的窗前','safe','先让守卫站稳，再处理闸门')]);
node('safe','inn','窗里有光了',
'旧旅店里没有人。你们扫开窗前的碎叶，把灯放在不会淋雨的地方。守卫站在门边，透过芦苇看向桥头；从这里，它仍然能看见那条低路。\n希莱斯留下陪它，你和菲恩沿刚走过的路回到闸门。桥边的箭头还牢牢立着。\n这一次，守卫已经不在闸前。温室的种植盘仍在水里摇晃。',

node('flood','device','低路沉下去了',
'手柄转动，水从闸下涌出。你们分几次抬起挡板，直到温室一侧的水位开始回落。桥下的低路一点一点沉进水面。\n高处传来石头碰地的声音。守卫冲到门外，朝着旧路迈了一步。\n你正沿高路返回，连忙举起从窗前递来的灯。光穿过雨幕，落在它眼前。守卫停住了。\n这时，桥柱上泡松的木牌脱落，沿水面旋转着漂来。希莱斯俯下身，用长树枝把它勾到岸边。',

node('seventh','inn','第七位',
'木牌最后一行露了出来。字比前六行小，像是后来有人踮着脚补上去的。\n“提灯的那个。也要回来。”\n守卫伸出一根手指，沿着那行字慢慢摸过去。它看了看牌子，又看了看你手里的灯。\n“第七位。”\n菲恩点头：“嗯。”\n守卫站在屋檐下。肩上的薄荷滴着水，身后是亮起来的窗。它终于把一直朝向旧路的身体转了回来。\n“到了。”',
[choice('rest','把木牌放好，陪它等雨停','dawn','今夜不用再站在水里了')]);
node('dawn','greenhouse','第二天，温室还没有全好',
'你们在旧旅店歇了一夜。天亮后，雨停了。温室里的水退下去大半，泥地仍然潮湿，有几株薄荷没能撑过昨夜，旧叶上的白边也没有消失。\n希莱斯没有说“一切都好了”。他把还活着的植株挪到通风的位置，剪掉软烂的叶片。\n守卫跟着你们走进来，自然地托住种植盘，等希莱斯腾出手，又把盘子放回平稳的架子上。它做得很熟练。\n你想起米娅写过的那句话：它今天也帮忙了。',
[choice('mint','和它一起整理留下来的薄荷','mint','留下还能生长的，也记住没有救回来的')],
[['potion-maker','这几株要慢慢养。根没有泡着，就有机会。']]);
node('mint','greenhouse','别淹着',
'希莱斯从干燥的种穗里取出两粒成熟的种子，没有去碰守卫肩上的薄荷。\n你拿出种子袋，守卫伸来一只大手。它先把袋底托住，等种子放好，再笨拙而认真地把袋口折了两次。\n“别淹着。”\n你说，家里有一处空着的窗台。守卫想了一会儿，把折好的小袋推到你手边。',

node('lamphouse','inn','灯屋',
'临走前，菲恩又摊开了地图。他没有擦去沉没的低路，只在旁边标上日期和水位，把昨夜确认的高路另画出来。\n旧旅店的位置，多了一个暖黄色的小点。\n“这里还叫旧旅店吗？”他问。\n守卫望着窗前的灯。你说，不如叫灯屋。\n它慢慢重复了一遍这个名字，然后用干燥的手指按住地图一角，让菲恩好把字写完。\n那块木牌被放在窗下。以后有人找来，就能读到完整的七行。',
[choice('lamp','看看已经不必彻夜举着的灯','moth','晨光里，灯罩内传来轻轻的翅声')]);
node('moth','inn','它下班了',
'你打开灯罩的小门。休息了一夜的小灯蛾爬到边缘，抖了抖翅膀。它先绕着守卫飞了一圈，又落在你的衣领上。\n菲恩压低声音：“它下班了。”\n希莱斯笑出声来。守卫认真想了想，看看空了的灯罩，又看看小灯蛾。\n“可以。”\n小灯蛾没有被关回去。窗外已经亮了，灯屋不需要谁一直站着发光。',
[choice('invite_moth','伸出手，让它自己选择同行','goodbye','它愿意跟来，就给它留一处窗边'),choice('leave_moth','把它送到灯屋窗边的薄荷上','goodbye','让它留在这里休息')]);
node('goodbye','inn','第七个小点不用擦掉',

node('window','entrance','给窗台留下一个位置',

 {id:'letter',title:'雾中的回信',tone:'温柔悬念',premise:'入口的薄荷丛里，夹着一句没有署名的留言：如果你又迷路了，就听风车。',chapters:[
 {title:'写在叶背的那句话',environment:'薄雾把入口的石阶切成一截一截。希莱斯停在薄荷丛前：一条褪色的纸带缠在茎上，字迹被雨水冲淡，只剩“如果你又迷路了，就听风车”。纸带下压着两粒成熟种子，像有人特意为下一位路过的人留下。远处没有风车转动的声音，只有水滴落在石阶上。',dialogue:[['potion-maker','不像采集标记。留下它的人，大概想让某个人找到这里。先别碰纸带，它一湿就会散。'],['fionn','“又迷路了”……听起来不像责怪。我画错路的时候，可没收到过这么客气的提醒。'],['potion-maker','那就先看一看。捡走种子，或者留在这里，都不必急着替这句话决定去向。'],['fionn','你想把它带回去，还是让下一位路过的人也看见？']],inspect:[['potion-maker','纸带背面画了三道小线，像风车叶片。种子已经干透，拿走不会伤到根。'],['fionn','这不是路标的写法，更像两个人之间才懂的暗号。不过我们可以先去看看那座风车。']],soloInspect:[['potion-maker','三道线朝着旧风车。我读不出是谁写的，但这两粒种子已经成熟；想带走的话，不用折断下面的茎。']],labels:['捡起种子，把留言记在心里','留好种子，让留言继续等人'],replies:['希莱斯把两粒种子收进纸袋，纸带仍留在茎上。你们记住那句话，向旧风车走去。','希莱斯扶正纸带，没有拿走种子。你们留下这个小小的约定，只把风车的位置记在心里。']},

 {title:'不是所有等待都需要答案',environment:'月池边的岸石确实挡住了风，石缝覆着松散的银露盐晶。没有等信的人，只有一只被湿草绊住的小灯蛾，一明一灭地照着空石面。希莱斯先蹲下来确认它没有受伤。那句“把灯留着”忽然有了一个很小、也很真实的形状。',dialogue:[['potion-maker','我们找到了留言说的地方，却没有找到写信的人。这样也算走完这一段了。'],['fionn','地图能告诉你石头在哪儿，不能保证石头上一定坐着谁。幸好这点光是真的。'],['potion-maker','先松开它的翅膀。它愿意跟着就一起回去，想留下也很好。']],inspect:[['potion-maker','草很松，慢慢拨开就好。它不是那封信的答案，只是现在需要一点帮助。'],['fionn','那就先管现在。等回家，茶凉了也还能重新温。']],soloInspect:[['potion-maker','只要拨开这根草，它就能飞。找不到写信的人，不妨碍我们把眼前这一件小事做好。']],labels:['解开湿草，给微光一个落脚处','解开湿草，让这盏灯留在岸边'],replies:['小灯蛾绕着干手帕飞了一圈，自己落到采集袋上。你们收好四份盐晶，带着这点光走上归途。','小灯蛾停在背风的岸石上。你们收好六份松散盐晶，把那一点明灭留给下一位经过的人。']}]},
 {id:'echo',title:'停摆风车的夜响',tone:'轻冒险 · 共同推理',premise:'明明停转多年的风车，今天却传来三声敲击。是谁在里面回应风？',chapters:[
 {title:'第三声总是慢半拍',environment:'入口的芦苇一起向风车方向低下去。笃、笃——过了一会儿，又一声笃。希莱斯手边的薄荷叶跟着颤动，几粒熟种从叶缝落下。声音并不响，却每次都在同一个地方停顿。',dialogue:[['fionn','如果是谁在敲门，这耐心也太好了。那座风车很久没人住了。'],['potion-maker','先别替它安排住客。你听，第三声之前，脚边的水会动一下。'],['fionn','那我们比一比，是风先来，还是声音先来。顺便决定这两粒种子要不要带回去。']],inspect:[['potion-maker','水纹从风车那边传过来，叶片是在水动之后才晃。不是风先吹的。'],['fionn','记下了。三个拍子，最后一下慢一点。等到风车那边再对一次。']],soloInspect:[['potion-maker','先是水纹，再是叶片，最后才听见第三声。顺序不会骗人。我们到上游看看。']],labels:['采下熟种，顺着水纹去查声音','留下熟种，专心记住敲击的间隔'],replies:['两粒熟种落进纸袋，叶片不再遮着水面。你们沿着敲击的方向出发。','种子留在薄荷丛下。你们多听了一轮，把“短、短、长”的间隔牢牢记住。']},
 {title:'风车没有醒，水却在走',environment:'苔石守卫守在风车外侧。更深处，一截松动的木舌悬在排水槽上，每逢积水倾下便敲击箱沿。箱里半张地图画着同一条水道，背面还有薄荷茶配方。声音的来源找到了，但第三声为什么总迟一点？',dialogue:[['fionn','敲门的住客找到了，是一块木头。先别笑我，木头也可能有秘密。'],['potion-maker','水槽不是直的，中间有一处回弯。第三声也许在等那一口水。'],['fionn','地图缺了一角，剩下的部分通向月池。把原件带走，或者抄下回弯，都能到那里确认。']],inspect:[['fionn','这三处标记不是桥，是三个泄水口。最后一处的线绕了个圈。'],['potion-maker','先不搬动木舌。我们还不知道它是不是在替哪条水路报信。']],soloInspect:[['potion-maker','纸上的第三道线绕了个弯，正好对应最慢的一响。保持水槽原样，到下游确认会更稳妥。']],labels:['收好旧图，沿原有水道核对','抄下三处标记，把旧图留下'],replies:['残页收进地图袋。你们没有动水槽，只把观察到的三个拍子带向下游。','三处标记抄在新纸上，原件仍守着这座风车。你们沿最后一条回弯去月池。']},
 {title:'听懂以后，声音就不吓人了',environment:'第三个泄水口藏在月池岸边。水先绕过盐晶覆盖的岸石，才轻轻撞上倒枝，难怪总慢半拍。倒枝间，一只小灯蛾被湿草绊住。每一声敲击都是一口水走过的路，并没有谁被困在风车里。',dialogue:[['fionn','原来“有人敲门”，只是水绕了个远路。我那一笔鬼屋，可以从地图上擦掉了。'],['potion-maker','别擦太干净。留一个提醒：声音可疑时，先看看水怎么走。'],['fionn','还有这一只。它比我们先到，却走得没我们顺利。帮它一下？']],inspect:[['potion-maker','它的翅膀没有伤，只要解开湿草。盐晶也只取松散的，别堵住这个泄水口。'],['fionn','水路保持原样。下次再听到三声，我们就知道这片湿地还在好好呼吸。']],soloInspect:[['potion-maker','原因对上了：水在回弯里多走了一段。取松散盐晶、松开湿草，然后让这里继续照自己的节奏走。']],labels:['帮小灯蛾脱困，邀它一同归家','松开湿草，给水路和小灯蛾留位置'],replies:['小灯蛾落在你们的采集袋上。四份盐晶收好，三下熟悉的敲击在身后再次响起。','小灯蛾在岸石上晾干翅膀。六份盐晶装袋后，水仍顺畅地流过第三处回弯。']}]},
 {id:'glimmer',title:'逆着水流的微光',tone:'自然奇遇 · 陪伴',premise:'薄荷丛的微光似乎正在逆流移动。跟着它，看看这片湿地怎样照顾自己的小住客。',chapters:[

 {title:'一张给小小旅客的地图',environment:'风车木箱上的微粉在阴影里更明显。半张旧地图沿着水道画了几个小圆点，背面记着薄荷与银露盐的茶饮配方。苔石守卫守住正路，外侧仍可绕行；地图上最后一个圆点，恰好在月池岸边。',dialogue:[['fionn','这些点太近了，不像给走路的人画的。一步就到了，何必画三个？'],['potion-maker','对一只灯蛾来说，一步很远。也许这些只是有人记下的停歇处。'],['fionn','那我把比例尺收起来。先按它们的大小看这张图。']],inspect:[['fionn','背风的木箱、低矮的叶片、岸边的平石。三个点都能停，也都不挡水。'],['potion-maker','我们还不能确定是谁画的，但能看见这些地方确实留出了余地。']],soloInspect:[['potion-maker','三个圆点都是背风处。画图的人是谁已经不知道了，但月池那块石头或许能让湿翅膀歇一歇。']],labels:['收好旧图，把这些歇脚处记住','描下停歇点，原件留给后来的人'],replies:['旧图平整地收好。你们记着地图的空白：那里不是漏画，而是给水与小住客留下的位置。','你们把小圆点描下来，没有改动原件。月池边最后一个停歇处还在等着确认。']},
 {title:'让它自己决定去哪里',environment:'月池的岸石闪着银露盐晶，最后一个圆点并没有画错。一只小灯蛾却停在更低的地方，湿草勾着翅膀，它试着振动，光也跟着颤。希莱斯把手放低，等它安静一点才靠近。一路追来的微光，现在终于有了清楚的轮廓。',dialogue:[['potion-maker','先帮它把翅膀松开。我们一路跟着光，不代表这点光应该归我们。'],['fionn','手帕放好了。它要是愿意过来，就让它自己落下。'],['potion-maker','家里有窗边，这里也有背风的岸石。两处都可以是好地方。']],inspect:[['potion-maker','没有伤口，只是累了。取一些松散盐晶就好，别搬走它脚下那块石头。'],['fionn','今天的地图可以加一条：有时，找到终点是为了给别人留条路。']],soloInspect:[['potion-maker','松开这根草，它就有力气飞了。我会把手帕留低一点；跟我们走还是留在岸边，让它自己选。']],labels:['解开湿草，等它愿意一起回家','解开湿草，让微光留在月池'],replies:['小灯蛾落在干手帕上，歇了一会儿又飞到采集袋边。你们带走四份盐晶，也为这个自愿跟来的住客留了位置。','小灯蛾停回背风的岸石。你们取好六份松散盐晶，离开时它的光已经不再颤动。']}]}];

 function ending(t){if(t?.auto)return A.summary(t);const s=byId(t?.story?.id);if(!s||!t.nodes.every(n=>n.choice))return null;const helped=t.nodes[2].choice==='help',copy=t.nodes[1].choice==='copy',gather=t.nodes[0].choice==='gather';const core={letter:helped?'信没有找到署名，窗边却多了一点愿意留下的光。':'没有人认领那封留言，但岸边的灯还留着。',echo:helped?'三声夜响的谜底是水路。你们带回的，不再是猜测，还有一位搭便车的小住客。':'风车没有被谁唤醒，是水一直在走。小灯蛾与第三处回弯，都安稳地留在湿地。',glimmer:helped?'一路追着的微光，自愿跟到了家门口。探索最后留下的，是一个可以自由停留的位置。':'你们看清了微光，却没有把它都带走。湿地保住自己的住客，旅途也完整地结束了。'}[s.id];return {title:s.title+' · '+(helped?'把一点光带回家':'为后来者留一盏灯'),text:core+(gather?'带回的种子可以在花园继续生长。':'入口的种子留在湿地，等下一季生长。')+(copy?'旧图的原件仍等在风车。':'残页从此有了干燥的归处。')+(t.participants.includes('fionn')?'菲恩核对路线，希莱斯收好行囊；这段路被两个人用不同的方式记住。':'希莱斯独自核对线索，把未能确认的部分留作下一次的疑问。')+(t.battle&&t.battle.status!=='avoided'?(t.battle.status==='victory'?'旧风车的守卫让开了路。':'你们安全退出守卫的范围，保住了已有发现。'):'')};}

 function valid(t){if(t.story===undefined)return true;const s=t.story;if(!s||!byId(s.id)||!Array.isArray(s.turns)||s.turns.length>18)return false;return s.turns.every(x=>x&&Number.isInteger(x.node)&&x.node>=0&&x.node<3&&t.nodes[x.node].visited&&typeof x.key==='string'&&x.key.length<250&&typeof x.user==='string'&&x.user.length<=500&&typeof x.narration==='string'&&x.narration.length<=1200&&Number.isFinite(x.at)&&x.at>=0&&Array.isArray(x.lines)&&x.lines.length>=1&&x.lines.length<=6&&x.lines.every(l=>Array.isArray(l)&&l.length===2&&t.participants.includes(l[0])&&typeof l[1]==='string'&&l[1].trim()&&l[1].length<=900));}
 const api={STORIES,byId,node,bridge,ending,key,valid};root.SymiaStories=api;if(typeof module!=='undefined')module.exports=api;

const catalog={"schemaVersion":1,"defaultId":"silas-reward-v3-painted_reed_bookmark","packages":[{"id":"silas-reward-v3-painted_reed_bookmark","version":1,"sourceSha256":"c84ad3a062285a824b9d9eba0a8410e1b25f64103471131e739cad4a049fccf4","packageSha256":"31dc09a494fb3c94514b96209ffa3b624b6acd642721975a61e5492cd6d5c7f1","publication":"local-preview","legacySaveCompatible":true,"title":"月池边，留一会儿","premise":"希莱斯带一本书独自到月池，在观察植物之后偶遇画画的旅人，保留专业兴趣，也允许自己只坐着读书。","worldId":"eiros","regionId":"grey-moon-marsh","mode":"solo-managed","participants":["potion-maker"],"nodes":[{"id":"s01","title":"书签停在这里","location_id":"entrance","narration":"希莱斯在湿地入口把书合上，拇指还夹在没读完的那一页。\n他原本只是想换个地方坐着。出门前挑书花了些时间，挑完又嫌重，换成一本薄的；走到这里，倒没有急着把它打开。\n没有人落在后面，也没有人等他认路。他在岔口站了一会儿，自己决定沿温室方向的外围小路走，到月池再歇脚。\n浅沟边的叶子挨得很密，有的伸向水面，有的贴着泥。希莱斯把书夹进包侧，低头走过一段湿滑的路肩。鞋底沾上一小团泥，他蹭了两下，没蹭干净，便放弃了。\n“回来再说。”\n这句话并没有说给谁听。\n他又走出几步，终于找到一个能把脚放稳的地方。路边的薄荷在风里晃，叶片的光泽一闪一闪。日色正在变低，亮处和暗处的颜色不同，却很难用一个词讲清。\n希莱斯从包里抽出那本薄书，看了眼封面，又塞回去，改拿随身的小记事本。他本来想休息，想了一下，觉得站在这里多看两眼也算。"},{"id":"s02","title":"一片叶子有几种颜色","location_id":"salt","narration":"他选了一片靠近路肩的叶子，没有摘，先从上面看，再侧过身。浅色的反光退去，叶面露出更深的绿。旁边另一片向下垂着，色泽又不同。\n希莱斯画了一个粗略的轮廓，在旁边写“深绿”，停笔，看向叶子，把“深”划掉。\n他翻了下记事本里夹着的几张纸，想找一处能比较的颜色。没有。于是把书抽出来看了眼封面，也不对。\n折腾完，他低低笑了一声，把两样东西都收好，只留下记事本。\n对魔药材料，他习惯尽量把状态说清楚。相近的名字未必意味着可以互换，含糊的记法也可能在以后让自己多跑一趟。他愿意花时间认真看，这一点并不会因为今天没有委托就消失。\n不过现在只有纸和一支笔。\n他用几道短线区分叶面受光的位置，又补上观察角度。画得并不好看，至少过后自己还能读懂。风来了，叶子转向，他没再追着改第三次，而是合起本子，站直身体。\n薄荷还在原地摇摆。他未确定什么新用途，也没有顺手剪下一枝，把今天变成一次计划外的采集。\n走出去时，他又看了一眼刚才画的那片叶子。它现在几乎背着光，比本子上任何一个被划掉的词都暗。\n“好吧，这个也算。”\n他在路旁停了一步，把这一点补进去，才继续往月池走。"},{"id":"s03","title":"别人没画完的下午","location_id":"pool","narration":"月池边有个人在画画。\n那人坐在一处干燥的岸边，面前压着一张纸，脚边放着几只小色碟。不是摊位，没有招牌，也没人等着付钱。希莱斯原想从后面过去，却在看见画里的水面时停了一下。\n纸上的月池偏灰，芦叶倒很鲜亮。画画的旅人抬起头，见他的目光停在叶子上，便问：“太绿了？”\n希莱斯看了看实物：“如果是岸边那几株，阴面应该再暗些。”\n旅人低头调了一点颜色，在纸边试下。\n“这样？”\n“近了。”\n对方又调，试了一笔，眉头却越皱越紧。希莱斯意识到自己站在后面，看到的叶面和对方并不相同，便走到相近的角度重新看。\n那人忽然把笔停住：“其实我喜欢刚才那个绿。”\n希莱斯一怔，随即笑了：“那留着。你问的是像不像，我答的是那个。”\n“我想画风过来的时候。颜色暗下去，就有点不想动了。”\n希莱斯不知道怎样让一笔绿色动起来。他看了一会儿纸，没有继续教对方调色，也没把自己的观察方式当作唯一做法。\n旅人重新用回原来偏亮的颜色，在芦叶旁边留了一块空白。这一次仍然不像希莱斯记事本里想分清的叶子，但他能看出对方满意了一点。\n“做什么的？”旅人随口问。\n“魔药。”\n“难怪看这么仔细。”\n“也有看不明白的时候。”希莱斯指了指那片没有补满的水面，“比如你这里。”\n对方说还没想好。两人都笑了，话题便停在那里。没有人报姓名，也没有人把这次闲谈变成一件需要共同完成的工作。"},{"id":"s04","title":"他没有接下那支笔","location_id":"pool","narration":"一阵风把纸角掀起来。旅人一手护住色碟，一手去按纸，碰倒了压边的小石。希莱斯离得近，伸手把纸角按住，等对方腾出手，才撤开。\n“多谢。要不要试一笔？”\n笔递到了面前，希莱斯没接。他今天不怎么想当场证明自己也能做这件事。\n“我看着就好。”\n旅人很自然地收回笔，继续画。希莱斯也就退开一点，选了另一块能落脚的岸石，坐下来。\n他把薄书拿出来，翻到夹着书签的地方，读了几行。余光里，对方仍在为那块水面停笔。希莱斯有一点想告诉那人，刚才那抹灰其实没那么坏，话到嘴边又停了。\n对方没有再问。\n他换了个姿势，让书背靠在膝上，接着往下读。这次真的读进去了。风翻动页角，他用手指压住。读到一段感兴趣的地方，他把书向前翻了几页核对，又翻回来，终于忘了旁边的画进行到哪里。\n太阳被云遮住了一会儿，纸上的字暗下来。他抬头，发现旅人正往后挪座位，从远处看自己的画。\n“你那里能看见整张吗？”那人问。\n“能。”\n“怎么样？”\n希莱斯看过，说：“我还是喜欢水边那一小块空着的地方。”\n对方歪头打量，没有立刻照他的意见改。希莱斯也没等一句认同，低头折好书签的位置。\n他已经坐得比原先打算的久了，肩膀松下来，脚边的泥开始变干。"},{"id":"reward_painted_reed_bookmark","title":"手绘芦苇书签","location_id":"pool","narration":"旅人收拾时，捡起一小片落在布边的干苇，压平后试了两笔绿色。颜色正是刚才坚持留下的那一种。\n“夹书用？”对方朝希莱斯手里的薄书示意。\n希莱斯接过来，看见上面两道简单的芦叶，旁边故意空着。“这回我不改颜色。”他说。\n旅人笑起来，把已经晾干的苇片递给他，明确说可以带走。希莱斯道了谢，等表面不再蹭色，才夹进自己的书里。整张画仍由旅人带走，这一枚小书签留给了他。"},{"id":"s05","title":"留下来的不是一张画","location_id":"pool","narration":"日色更低时，旅人开始收拾色碟。\n那张画没有完全填满。希莱斯看见，对方把纸放进自己的画夹，动作很小心。纸滑进去之前，那片过于鲜亮的绿色又露出来一次，他抬了抬手，算作道别。\n希莱斯把收到的苇片书签压平，旅人向他点点头，沿另一侧的路走了。两人没有约定重逢。\n希莱斯仍坐在石上，把自己的记事本翻出来。他画过的叶片轮廓粗糙得很，几道短线挤在一起，和刚才的画比起来，实在算不上好看。\n他看了一会儿，没有撕掉。\n那张画要留下风过来的感觉；他的记录要让以后翻到这一页的自己，知道当时站在什么位置、看到了哪一面。两个人用了不同的办法。对方的画有没有完成，不需要他裁定。\n他在页角补了一个很小的阴影，把刚才没记下的方向写清。然后看着那道歪斜的叶脉，想了想，还是决定以后有空练练。\n不是每次都能靠文字把材料的状态说清。他不打算因此放下自己的工作，反而又找到一点想做得更好的地方。\n不过今天已经坐够了。\n希莱斯把本子合上，肩带从石面拎起来，检查没有留下纸屑。池边恢复了空荡荡的样子，画里的那阵风早就过去，水面又换了一个颜色。\n他站在那里看完最后一眼，没有重新拿笔。"},{"id":"s06","title":"回去以后再读","location_id":"entrance","narration":"沿着来时的外围路返回，希莱斯又经过那丛薄荷。\n他认出了先前画的叶子，至少觉得是那一片。此时光线更暗，位置相似的几片叶子交叠在一起，他没有拨开来确认，也没有把“应该是”改说成肯定。\n他蹲下把鞋底已经干了的泥蹭掉，这次容易多了。站起来时，腿有一点坐久之后的僵硬。他活动几下，慢慢往入口走。\n记事本和薄书都在包里。一个多了几行能用的观察，另一个还没读完。他检查过收获的包放得稳妥，才摸向书角，想起自己刚才读到的地方，有点盼着回去找张舒服的椅子。\n这趟出门比他原先预计的长些。他见了一个刚好在那里的人，说过几句话，帮忙按过一次纸，又把别人的下午还给了别人。\n到了入口，他想起那人最后坚持用回去的亮绿，自己也笑了一下。要他用在材料记录里，大概仍然不会选那个颜色。但放在那张画上，他已经不想再替对方调暗了。\n他把肩带往上提，摸到包侧薄书硬硬的书角。\n回去洗过手，找个舒服的位置，还能继续读。"}],"schedule":{"version":1,"nodeOffsetsMs":[0,60000,150000,270000,390000,420000,510000],"durationMs":600000},"rewardId":"painted_reed_bookmark","rewardQuantity":1,"rewardNode":"reward_painted_reed_bookmark","tags":["meet_people","rare_life"],"returnShare":"今天在月池看了会儿书，也跟画画的人聊了几句。那位旅人送了我一枚手绘芦苇书签。还是那种亮绿，这次我不改了。","homeDisplay":"回家继续读那本书，翻到停下的页码时露出两道亮绿。希莱斯这次没有再嫌颜色太亮。","presentation":{"rendererId":"moon-pool-loop-v002","moments":{"s01":{"title":"带一本书出门","place":"湿地入口","text":"鞋边的泥还没干。希莱斯擦了两下，索性先带着书往月池走。","bubble":"先不管这点泥了。找个地方看书。","state":"walking","eventId":"s_depart","sceneId":"BG01","motionProfile":"entry","painterPresent":false},"s02":{"title":"深绿，还是浅绿","place":"薄荷小径","text":"换个角度，薄荷叶又浅了一点。他划掉“深”字，补上了光线和观察角度。","bubble":"深绿……换个角度，又浅了一点。","state":"observing","alt":"希莱斯俯身观察仍长在路边的薄荷，笔尖停在记录本上","eventId":"s_leaf","sceneId":"BG02","motionProfile":"mint-arrival","painterPresent":false,"assetId":"cg-silas-mint-v1","displayAfterNode":"s02","image":"/symia-demo/expedition/media/cdf5ea91d3af09557353b5e3.png"},"s03":{"title":"画里偏偏是亮绿","place":"月池岸边","text":"画画的旅人喜欢亮绿。他们聊了几句：一个想记准叶色，一个想画风吹过芦苇的感觉。","bubble":"那就留着你喜欢的亮绿。","state":"observing","alt":"希莱斯在月池干岸旁，看一位旅人用亮绿描绘水边芦苇","eventId":"s_painter","sceneId":"BG03","motionProfile":"pool-arrival","painterPresent":true,"assetId":"cg-silas-painter-v1","displayAfterNode":"s03","image":"/symia-demo/expedition/media/ddfdf2bf4c0008c7ffbd0008.png"},"s04":{"title":"留在旁边，读一会儿","place":"月池岸边","text":"他替旅人压住被风掀起的纸角，却没接那支画笔。等纸稳了，便在旁边翻开自己的书。","bubble":"你继续画。我在这里读一会儿。","state":"observing","eventId":"s_read","sceneId":"BG03","motionProfile":"pool-hold","painterPresent":true},"reward_painted_reed_bookmark":{"title":"收下一枚芦苇书签","place":"月池岸边","text":"旅人在干芦苇片上画了两道亮绿，送给他作书签。等颜色干了，他才夹进书里。","bubble":"还是这两道亮绿。谢谢，我收下了。","state":"collecting","reward":true,"eventId":"reward_event_painted_reed_bookmark","sceneId":"BG03","motionProfile":"pool-hold","painterPresent":true},"s05":{"title":"留下来的不是那张画","place":"月池岸边","text":"旅人收起自己的画离开了。希莱斯补记了观察方向，也想抽空练练怎么画清楚叶子。","bubble":"有空，再练练怎么画清楚这些叶子。","state":"observing","eventId":null,"sceneId":"BG03","motionProfile":"pool-hold","painterPresent":false},"s06":{"title":"回去再读下一页","place":"归家小路","text":"回程又经过那丛薄荷，鞋边的泥也干了。书里夹着两道亮绿，下一页留到家里读。","bubble":"回去以后，再读下一页。","state":"walking","eventId":"s_end","sceneId":"BG02","motionProfile":"return","painterPresent":false}},"artAssets":["travel-loop-entry-far","travel-loop-entry-mid","travel-loop-entry-near","travel-loop-sign","travel-loop-mint-mid","travel-loop-mint-near","travel-loop-entry-connector","travel-loop-greenhouse","travel-loop-mint","travel-loop-walk-a","travel-loop-walk-b","travel-loop-walk-c","travel-loop-walk-d","travel-loop-idle","travel-loop-pool-far","travel-loop-pool-mid","travel-loop-pool-near-clean","travel-loop-pool-connector","travel-loop-seat","travel-loop-pool-tree"],"returnSecondLegMs":570000,"ui":{"weather":"月池边的午后","tripLabel":"希莱斯独行 · 灰月湿地","returnTitle":"希莱斯带着书签回来了","returnEntryTitle":"带着书签回到家","returnPending":"希莱斯回来了。收好书签后，这一趟会留在旅行日记里。","returnComplete":"书签已经收好，完整故事留在旅行日记里。","claimLabel":"收好书签，保存旅行日记"},"artUrls":["/symia-demo/expedition/media/30114e35f0e010fa45a7cc51.png","/symia-demo/expedition/media/588c80ba486a512dda38e835.png","/symia-demo/expedition/media/f7ae39e18bacb62e72c2a52b.png","/symia-demo/expedition/media/8eda3a5e3cd091002221ffa8.png","/symia-demo/expedition/media/df401f1f8f0290a02079f3ca.png","/symia-demo/expedition/media/32f13d2196f9ccbddede5569.png","/symia-demo/expedition/media/f57f544c92d94d517bd0f8e0.png","/symia-demo/expedition/media/739f6d9b9161603e16f2e6be.png","/symia-demo/expedition/media/08c6010cd1972f22e55960a1.png","/symia-demo/expedition/media/162020ffaaead06b14ff20ff.png","/symia-demo/expedition/media/cb844a6eb681615867e6c066.png","/symia-demo/expedition/media/468a3d676ff0625776e9f21b.png","/symia-demo/expedition/media/9420fa4a34413c0ee23a26e4.png","/symia-demo/expedition/media/752ce2f6630c042ce9449e75.png","/symia-demo/expedition/media/2a6 ead06b14ff20ff73ff85855d688b49fe651d210b336bb455ab2e26","width":1254,"height":1254},{"id":"travel-loop-walk-b","path":"assets/travel-loop-walk-b.png","sha256":"cb844a6eb681615867e6c066c30988f980ee79581319e0dfb001b8c9a20f6aba","width":1254,"height":1254},{"id":"travel-loop-walk-c","path":"assets/travel-loop-walk-c.png","sha256":"468a3d676ff0625776e9f21b74b926348dc4d6a7cea0455a6274505f18fb38aa","width":1254,"height":1254},{"id":"travel-loop-walk-d","path":"assets/travel-loop-walk-d.png","sha256":"9420fa4a34413c0ee23a26e4c918dace9af71117514f28b4ed88f6bf39bbfa7a","width":1254,"height":1254},{"id":"travel-loop-idle","path":"assets/travel-loop-idle.png","sha256":"752ce2f6630c042ce9449e751e9586b8ea70a1f3278cc78985be2b3a0bca62e2","width":1254,"height":1254},{"id":"travel-loop-pool-far","path":"assets/travel-loop-pool-far.png","sha256":"2a647d114af84f07bcec2048dccfa8ef528536940adeff5a787913bffc775da9","width":1942,"height":809},{"id":"travel-loop-pool-mid","path":"assets/travel-loop-pool-mid.png","sha256":"f7631829bc36bd34a24ea7618cc089babd920d9f8281b7d7e5855ffeaf4a3a24","width":1942,"height":809},{"id":"travel-loop-pool-near-clean","path":"assets/travel-loop-pool-near-clean.png","sha256":"c736afe7fc08f96bdb22841c59234c3bc437f16891986c8f254bab8ea24f582b","width":1940,"height":810},{"id":"travel-loop-pool-connector","path":"assets/travel-loop-pool-connector.png","sha256":"fc978bc591ea19b4d30da4344b80688991654f5730a69db399627934ab4ad799","width":1254,"height":1254},{"id":"travel-loop-seat","path":"assets/travel-loop-seat.png","sha256":"664e4a52f6e568cf737ffb4f9e2c1c59e5a53baa2f1c5203e31d851da65712ee","width":1672,"height":941},{"id":"travel-loop-pool-tree","path":"assets/travel-loop-pool-tree.png","sha256":"2d354679d3fd8408ad9f1604ce0bd890e6a7e1432eed47455c6563547dd29d44","width":1536,"height":1024},{"id":"cg-silas-mint-v1","path":"assets/cg-silas-mint-v1.png","sha256":"cdf5ea91d3af09557353b5e3628b97db554cfe2ef91d9f57de88e56a21f72e4b","width":1672,"height":941},{"id":"cg-silas-painter-v1","path":"assets/cg-silas-painter-v1.png","sha256":"ddfdf2bf4c0008c7ffbd0008ffb35a6a747300fac54780e5d4a23e29c8b9e465","width":1672,"height":941}],"reviewEvidence":{"sourceStatus":"draft","publication":"local-preview","userExperienceAcceptance":{"accepted":true,"userMessage":"我测过了 没问题","scope":"当前月池图文与旅行体验基准；不替代新生成内容审核、全部分支审核或正式发布批准"},"literaryApproval":false,"formalPublicationApproval":false}},{"id":"silas-moon-pool-together-v1","version":1,"sourceSha256":"810a91e251100f171cf4ac90b1364d94e9473cf9fa578f585862cf8718b07c99","packageSha256":"fda6f781704ecb08ec3bb430684ea49ed3a8486b41d7fb8f6630e621545f1f70","publication":"local-preview","legacySaveCompatible":false,"title":"月池边，再坐一会儿","premise":"希莱斯与你沿灰月湿地采薄荷、看小鸟，到月池停留后一起归家。","worldId":"eiros","regionId":"grey-moon-marsh","mode":"together-reading","participants":["potion-maker"],"userPresent":true,"nodes":[{"id":"t01","title":"一、这一趟不用赶","location_id":"entrance","narration":"走到湿地入口时，希莱斯把肩上的包往上提了提，停下来等你。\n\n包侧露着一本薄书，里面还塞着折好的纸袋。你看了两眼，他便主动交代：\n\n“摘一点薄荷，去月池坐坐。书是顺手带的，读不读再说。”\n\n“听起来已经安排满了。”\n\n“那把读书划掉。”他答得很快，自己也笑了，“这个最容易。”\n\n他把纸袋递给你一只。袋口折得有些紧，你拆了两下没打开，他伸出手，却没有直接拿走，等你把它递过去，才沿着折痕松开。\n\n“只要这么一点？”\n\n“够今晚用了。多摘了还得收拾，我今天不太想给自己添活。”\n\n你们沿外围小路往月池走。日光已经低下来，斜斜穿过芦苇，落在潮湿的木栏上。希莱斯走在靠沟的一边，偶尔停下来看看路旁的叶子。你发现他看东西很专注，却并不总急着解释；有时你问了，他也只说还没看清。\n\n走过一段泥软的路肩，他忽然停住，把记事本从包里抽了出来。\n\n“来，帮我看看这个。”"},{"id":"t02","title":"二、你站的那一边","location_id":"salt","narration":"他指的是一片薄荷叶。\n\n本子上刚写下“深绿”，字还没写完，笔尖便悬在了最后一笔上。\n\n“我看着是浅绿。”你说。\n\n希莱斯抬头看了看你的位置，没改字，先挪到你身旁。\n\n叶面接着夕光，边缘亮得有些透明。从这里看，确实浅了许多。\n\n“难怪。”他往旁边让开，“你到我刚才站的地方看看。”\n\n你换过去，那层亮色退了，叶脉间的绿一下子沉下来。\n\n两个人绕着同一丛薄荷挪了半圈，最后同时停住。希莱斯看看你，又看看手里那两个还没写完的字，笑出了声。\n\n“再转下去，我们得给它记四个颜色。”\n\n“那到底写哪个？”\n\n“都留着。补个朝向，回去还能看懂。”\n\n他在轮廓旁边画了两道短线，把本子转给你。叶子画得有点歪，箭头倒很清楚。\n\n“你画的这片，比真的胖。”\n\n“这个我知道。”他把本子收起来，“暂时没救。先挑今晚要用的。”\n\n他从一丛长得密实的薄荷旁剪下几枝，递给你看，再放进纸袋。你蹲到稍远一点的地方，想挑几片完整的叶子给他。\n\n两丛薄荷之间夹着枯黄的苇叶。你伸手去拨，指侧忽然一刺。\n\n你下意识缩回手。叶尖晃了两下，指根边已经沁出一线红。"},{"id":"t03","title":"三、借我一下手","location_id":"salt","narration":"希莱斯先听见了你吸气的声音。\n\n“怎么了？”\n\n你把手翻过来，原想说只是划了一下。他已经把剪子合拢放进包侧，蹲到你面前。\n\n“给我看看。”\n\n你把手递过去。他托住你的手腕，低头看了片刻，脸上的笑意收了，却没显得慌。\n\n“先别摘了。到那块干石头上坐。”\n\n纸袋被你放在脚边，里面才装了小半袋薄荷。你坐下时还看了它一眼，希莱斯顺着你的目光把袋口折好，搁到自己包上。\n\n“它不会跑。”\n\n他拿出水，清掉你手边沾着的碎屑，又从纸封里取了一小片干净敷布。碰到伤口附近时，你的手指轻轻蜷了一下。\n\n他的动作随即停住。\n\n“疼？”\n\n“有一点。”\n\n“嗯。别急着伸直。”\n\n他让你先按住敷布，自己低下头，解开左手绷带末端的小结。\n\n你这才注意到，他手上原本缠得整齐的白色绷带，正一圈一圈松开。外面的两圈被拆下来，他用小剪子截出一段，将余下的重新掖好，才把那截布带绕在你手上，固定住敷布。\n\n“你拆自己的？”\n\n“现成的，够用。”\n\n他托着你的手，把结留在不会压到伤口的位置，停下来问你勒不勒。\n\n你摇头，目光却还落在他的左手上。\n\n“那你的呢？”\n\n希莱斯顺着看了一眼，用拇指把有些翘起的布边压回去。\n\n“还够。回去我也换一段新的。”\n\n你想动动手指，他没拦，只轻轻扶着你的手腕，让你自己试。\n\n“早知道就不去拨那片叶子了。”\n\n“现在知道了。”他把水收好，语气仍很平常，“那几枝也留着吧。袋里这些够了。”\n\n你有点不甘心：“我还没帮上多少。”\n\n“刚才那个浅绿是谁看出来的？”\n\n“那也算？”\n\n“算。我本来真准备只写深绿。”\n\n他说完，低头收起散在石面上的纸封，没有再接一番劝慰。你看着手上的白色布带，刚才那阵刺痛慢慢退成一点清楚的隐痛。\n\n希莱斯在旁边坐了下来，给你留了些缓过来的时间。\n\n“今天还想去月池吗？”\n\n“想。现在回去，有点可惜。”\n\n他看了一眼渐低的日头，又看看你包好的手。\n\n“那走干一点的路。还不舒服就告诉我，我们改道回去。”\n\n你点头。他把两只小纸袋都收进包里，站起来，却没催你。\n\n等你起身跟上，他才继续往前走。"},{"id":"t04","title":"四、先让它过去","location_id":"pool","narration":"快到月池时，你听见木栏下面有细细的叫声。\n\n希莱斯已经往前走了两步，被你叫住，又折回来。\n\n一只灰褐色的小鸟停在步道边，尾巴短短的，朝草坡跳了几次，总被横倒的枯苇挡回来。你先看见了坡上的成鸟。它落在一根低枝上，叫一声，小鸟就抬一次头。\n\n“它是不是想回那边？”\n\n“看着像。”希莱斯跟着蹲下来，“先退开一点，别堵着它。”\n\n你挪到步道外侧，给它留出空隙。他抬起横在缺口处的枯苇。小鸟却没动，歪着头看了看你，又看他。\n\n希莱斯维持着那个不太舒服的姿势，小声说：\n\n“路都借给你了。走吧。”\n\n成鸟又叫了一声。\n\n这次，小鸟终于钻过空隙，摇摇晃晃地跳进草里。成鸟落下来，领着它往芦苇根部走。你从草叶间看见一只小巢；它刚钻进去，里面另外两团绒毛也跟着动了动。\n\n你拍拍希莱斯的衣袖，指给他看。\n\n他顺着望过去，等小鸟整个藏好，才慢慢放下枯苇。\n\n“找着了。”\n\n你们没再靠近。退回小路时，他肩上挂着一截断苇，你用没受伤的手替他摘下来，放进他摊开的掌心。\n\n“还送你一根。”\n\n希莱斯看了看，拿手指比了一下长短，把它夹进记事本。\n\n“正好。就夹在今天这本书里。”\n\n走出几步，他又回头望了一眼那片芦苇。\n\n“要不是你叫我，我已经过去了。”"},{"id":"t05","title":"五、亮起来以后","location_id":"pool","narration":"到月池时，岸边还剩最后一点暖光。\n\n希莱斯找了一块干燥平整的石头，放下包，和你一起坐下。他没拿书，先把被肩带压皱的衣角扯平，长长舒了口气。\n\n你笑他：“不是说这一趟不用赶吗？”\n\n“没赶。蹲得多，腿也累。”\n\n他把腿伸出去一点，转头看你。\n\n“手呢？”\n\n“不怎么疼了。你不用一直看。”\n\n“好。那我看水。”\n\n他真就转了过去。\n\n水面一点点暗下来，芦苇的影子连成了一片。你们说了几句小鸟，又说起那片怎么都说不准颜色的薄荷。后来话停了，只剩风拂过草叶的响声。\n\n最先亮起来的那一点很低。\n\n你几乎以为是水里的倒影，直到它离开苇秆，晃晃悠悠地升高。\n\n“希莱斯，看。”\n\n他沿着你指的方向俯下身。那点光熄了一次，再亮起来时，旁边已经多了两三点。渐渐地，岸边的草丛像醒过来一样，许多萤火虫从暗处飞起，有的停在叶尖，有的飞向水上。\n\n希莱斯原本撑着石面准备换个坐姿，这时停住了。\n\n“原来都在这里。”\n\n一只萤火虫从你们面前飞过，光亮掠过他的手指。你看见他左手的布带缺了外面一截，边缘不如出发时齐整；少掉的那一段，现在正绕在你手上。\n\n希莱斯把包往外侧挪了挪，空出身旁的位置。\n“现在回去，好像有点可惜。”他转头看你，“陪我再坐一会儿？”"},{"id":"t06","title":"六、回去再换新的","location_id":"entrance","narration":"离开月池时，天色已经深了。希莱斯拿出随身的小灯，照着前面的干路，你走在他身侧。\n\n来时让你们争论了半天的那丛薄荷，此时只剩模糊的轮廓。你没有伸手，他也没停下来找那一片叶子。\n\n“你还记得是哪片吗？”\n\n“大概记得。”他看了一眼，“现在让我指，我可不敢保证。”\n\n走到入口，你提醒他左手的布边又翘起来了。他低头按住，抬手给你看。\n\n“记着呢。回去一起换新的。”\n\n回家以后，他先把纸袋放到桌上。薄荷的气味散出来，那截短短的干苇也从本子里滑落。\n\n你用没受伤的手把它接住，放到那本一路没打开的书旁边。\n\n“今天书白带了。”\n\n希莱斯正在找干净敷料，听见这话，回头看了一眼。\n\n“不算。至少把书签带回来了。”\n\n他把东西拿过来，在你对面坐下。桌灯亮着，窗外已经完全黑了。\n\n“手给我。”\n\n这次你没有先说没关系。\n\n你把手放进他掌心，另一只手将新绷带往他那边推了推。\n\n“我的换完，就轮到你。”\n\n希莱斯低头看着那卷绷带，笑着应了一声。\n\n“好。”"}],"schedule":{"version":1,"durationMs":0,"nodeOffsetsMs":[]},"rewardId":null,"rewardQuantity":0,"rewardNode":null,"tags":[],"returnShare":"你与希莱斯一起走过灰月湿地，辨认薄荷的颜色，处理了手上的小伤，也为小鸟让开了回巢的路。月池边的停留按你这次实际选择记录。归家后，你们一起换了新的绷带。","homeDisplay":"你与希莱斯一起走过灰月湿地，辨认薄荷的颜色，处理了手上的小伤，也为小鸟让开了回巢的路。月池边的停留按你这次实际选择记录。归家后，你们一起换了新的绷带。","authoredStay":"“我刚才其实有点不好意思。”你说。\n\n他转过头，等着你继续。\n\n“本来想陪你采东西，结果还得坐在那里，让你忙。”\n\n希莱斯看了看包，又看向你。\n\n“我今天只打算摘半袋。已经有了。”\n\n“我知道。我是说……跟你出来，我好像总想表现得能帮上忙。”\n\n这一次他没马上接玩笑。\n\n水边有一团光聚起来，又慢慢散开。希莱斯看了一会儿，手指在包带上松了松。\n\n“那会很累。”他说，“你一直在看我还缺什么，就顾不上自己想看什么了。”\n\n“可你不是也一直在留意我的手？”\n\n他一怔，随即低头笑了。\n\n“这话倒没错。刚才你让我别总看，我才停。”\n\n你们安静了一阵。他没有急着把话圆回来，过了一会儿才接着说：\n\n“有时候我忙着弄清一件事，会把别的都搁在旁边。先觉得再看一眼就好，再记一笔就好……回头才发现坐得腰都僵了。”\n\n“今天也差点？”\n\n“那片叶子，再换个方向，我还能改第三遍。”\n\n他望着水边的光，语气慢慢松下来。\n\n“我还是想把这些东西做好。没委托的时候也想。就是有时候，得有人叫我一声，我才想起来天已经晚了。”\n\n“那以后我叫你，你会走吗？”\n\n“不一定。”他答得坦然，“真有没弄完的，我会告诉你。要你等，也会说要等多久。总不能让你在旁边猜。”\n\n“说好了。不能每次都说马上。”\n\n希莱斯笑了，偏头看你。\n\n“行。这条我认。”\n\n你低头看了看包好的手，忽然觉得接下来的话容易说一些。\n\n“其实有时候，我也没什么特别想看的。只是想跟你出来走走。”\n\n他没有立刻回答。你抬起头，发现他已经在看你。\n\n“那就直说。”他的声音很轻，“我也会想。”\n\n风从水面过来，把一小片芦叶翻出了亮面。他伸手将包移到另一侧，把两人中间腾出来。\n\n“今天让你拿纸袋的时候，我还在想，到了月池，你会不会觉得坐着没意思。”\n\n“所以还带了书？”\n\n“书本来是给我自己的。”他笑起来，“不过你要抢，我也分得出来。”\n\n你也笑了，稍稍往他那边挪了一点。\n\n“现在不想看书。”\n\n“我也是。”\n\n他没有再拿本子。你们看着那些光在芦苇间明明灭灭，有时一群聚在一起，有时只剩零散几只。\n\n过了一会儿，你问他：“这个算浅绿吗？”\n\n希莱斯认真看了片刻。\n\n“比刚才那个还难说。”\n\n“不记了？”\n\n他摇摇头。\n\n“明天再惦记。现在再坐一会儿。”","presentation":{"rendererId":"moon-pool-together-v1","dramaNode":"t05","moments":{"t01":{"title":"一、这一趟不用赶","place":"湿地入口","text":"走到湿地入口时，希莱斯把肩上的包往上提了提，停下来等你。","bubble":"再慢慢走一会儿。","state":"observing","eventId":"t01-arrive","backgroundAsset":"travel-loop-entry-mid","background":"/symia-demo/expedition/media/588c80ba486a512dda38e835.png"},"t02":{"title":"二、你站的那一边","place":"薄荷小径","text":"他指的是一片薄荷叶。","bubble":"再慢慢走一会儿。","state":"observing","eventId":"t02-arrive","backgroundAsset":"travel-loop-mint-mid","background":"/symia-demo/expedition/media/df401f1f8f0290a02079f3ca.png"},"t03":{"title":"三、借我一下手","place":"小径旁的干石头","text":"希莱斯先听见了你吸气的声音。","bubble":"再慢慢走一会儿。","state":"observing","eventId":"t03-arrive","backgroundAsset":"travel-loop-mint-mid","assetId":"cg-together-bandage-v1","requiresStay":false,"alt":"希莱斯为第一视角的同行者固定手上敷布","background":"/symia-demo/expedition/media/df401f1f8f0290a02079f3ca.png","image":"/symia-demo/expedition/media/dd9fe7212c95009de357e647.png"},"t04":{"title":"四、先让它过去","place":"月池步道","text":"快到月池时，你听见木栏下面有细细的叫声。","bubble":"再慢慢走一会儿。","state":"observing","eventId":"t04-arrive","backgroundAsset":"travel-loop-pool-mid","background":"/symia-demo/expedition/media/f7631829bc36bd34a24ea761.png"},"t05":{"title":"五、亮起来以后","place":"月池岸边","text":"到月池时，岸边还剩最后一点暖光。","bubble":"再慢慢走一会儿。","state":"observing","eventId":"t05-arrive","backgroundAsset":"travel-loop-pool-mid","assetId":"cg-together-pool-v1","requiresStay":true,"alt":"女主背影与希莱斯坐在月池边看萤火虫","background":"/symia-demo/expedition/media/f7631829bc36bd34a24ea761.png","image":"/symia-demo/expedition/media/3ddde8a0d9be25c77f56bccd.png"},"t06":{"title":"六、回去再换新的","place":"归家小路与家中","text":"离开月池时，天色已经深了。希莱斯拿出随身的小灯，照着前面的干路，你走在他身侧。","bubble":"再慢慢走一会儿。","state":"observing","eventId":"t06-arrive","backgroundAsset":"travel-loop-mint-mid","background":"/symia-demo/expedition/media/df401f1f8f0290a02079f3ca.png"}},"ui":{"weather":"月池边的黄昏","tripLabel":"你与希莱斯同行 · 灰月湿地","returnTitle":"你们一起回到了家","returnEntryTi  if(action==='garden-hour'){await dispatch({type:'ADVANCE_DEMO',ms:G.HOUR});return;}
 const types={'garden-harvest':'GARDEN_HARVEST','garden-harvest-all':'GARDEN_HARVEST_ALL','garden-protect':'GARDEN_PROTECT','garden-water':'GARDEN_WATER','garden-mature':'GARDEN_DEMO_MATURE','garden-agent':'GARDEN_DEMO_AGENT','garden-seeds':'GARDEN_DEMO_SEEDS'};
 if(types[action])await dispatch({type:types[action],index});
}
document.addEventListener('change',async e=>{const b=e.target;if(b.dataset.gardenSetting==='managed')await dispatch({type:'GARDEN_SETTINGS',managed:b.checked});if(b.dataset.gardenSetting==='empty')await dispatch({type:'GARDEN_SETTINGS',reservedEmpty:Number(b.value)});if(b.dataset.gardenReserve)await dispatch({type:'GARDEN_SETTINGS',crop:b.dataset.gardenReserve,reserve:Number(b.value)});});
// Mouse drag is an optional shortcut; touch and keyboard keep normal button activation.
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-action="garden-plot"]');if(!b||e.pointerType!=='mouse'||e.button!==0)return;gardenDrag={x:e.clientX,y:e.clientY,first:Number(b.dataset.index),seen:new Set(),moved:false};});
document.addEventListener('pointermove',async e=>{const d=gardenDrag;if(!d||!(e.buttons&1))return;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<6&&!d.moved)return;d.moved=true;const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-action="garden-plot"]');const indices=[d.first,...(b?[Number(b.dataset.index)]:[])];for(const index of indices){if(d.seen.has(index))continue;d.seen.add(index);if(state.garden.plots[index])continue;gardenView.index=index;await dispatch({type:'GARDEN_SOW',index,crop:gardenView.crop,kind:gardenView.kind});}});
document.addEventListener('pointerup',()=>{if(gardenDrag?.moved){gardenSuppressClick=true;setTimeout(()=>gardenSuppressClick=false,0);}gardenDrag=null;});
document.addEventListener('pointercancel',()=>{gardenDrag=null;});
document.addEventListener('input',e=>{if(e.target.id==='talk-input')draft=e.target.value;});
document.addEventListener('submit',e=>{if(e.target.id==='talk-form'){e.preventDefault();talk();}});
document.addEventListener('change',async e=>{if(e.target.id==='autonomous-mode'){autonomous=e.target.checked;render();}if(e.target.id==='auto-detail'){autoDetail=e.target.checked;cancelArrival();try{localStorage.setItem('symia.expedition.auto-detail',String(autoDetail));}catch{toast('此浏览器不能保存偏好，本次页面内仍然生效。');}updateOverview();const footer=$('.overview-footer span:last-child');if(footer)footer.textContent=autoDetail?'抵达后展开':'仅提示 · 点击查看';}if(e.target.id==='story-choice'){storyChoice=e.target.value;render();}if(e.target.id==='slow-reading'){slowReading=e.target.checked;if(!slowReading&&state.trip?.readingHold){void commitAction({type:'TICK',reading:false}).catch(()=>{});}clocks();}if(e.target.id==='party-fionn')await dispatch({type:'SET_PARTY',fionn:e.target.checked});if(e.target.id==='live-toggle'){live=e.target.checked;if(!live){autoDialogue.cancel();sliceDialogue.cancel();}clearReply();render();}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();const action=b.dataset.action;
  try{
  if(action.startsWith('together-')){await SymiaTogether.handle(action,b,{getState:()=>state,dispatch,render,modal,button});return;}
  if(action==='package-select'){if(forgeActionBusy||storage.error||state.trip&&state.trip.phase!=='complete')return;if(SymiaTravelPackages.get(b.dataset.packet)){selectedPackage=b.dataset.packet;render();}return;}
  if(episodeTest&&action.startsWith('episode-')){
    if(forgeActionBusy||storage.error)return;
    if(action==='episode-text'&&state.trip?.forge){modal('本段原文',SymiaEpisodeTest.text(state.trip));return;}
    if(action==='episode-next'&&state.trip?.forge&&state.trip.phase==='exploring'){
      const t=state.trip,F=SymiaForge,schedule=F.scheduleFor(t),target=t.startedAt+(schedule.nodeOffsetsMs[t.forge.index+1]??schedule.durationMs);
      forgeActionBusy=true;syncForgeControls();
      try{await dispatch({type:'ADVANCE_DEMO',ms:Math.max(0,target-now())});}finally{forgeActionBusy=false;syncForgeControls();}return;
    }
    if(action==='episode-restart'){
      stateWrites++;forgeActionBusy=true;syncForgeControls();
      try{const result=await storage.transact(()=>E.transition(E.createState(crypto.randomUUID()),{type:'FORGE_START',packetId:selectedPackage},Date.now()));state=result.next;closeDetail();$('#modal').close();journeyUi.trip=null;travelFootprints=false;page='world';render();window.scrollTo(0,0);}finally{stateWrites--;forgeActionBusy=false;syncForgeControls();}
      return;
    }
    return;
  }
  if(episodeTest&&['travel-start','start','travel-legacy','world-select','world-preview-next'].includes(action)){toast('本轮只开放月池故事测试。');return;}
  if(action.startsWith('forge-')){
    if(action==='forge-review'||action==='forge-cg'){const t=[state.trip,...state.history].find(t=>t?.forge&&(b.dataset.journey?t.id===b.dataset.journey:t.phase==='complete'));if(!t)return;if(action==='forge-review'&&t.phase!=='exploring')modal('旅行日记',SymiaForgeView.archive(t)+button('返回日记目录','travel-diaries','','text-button'));if(action==='forge-cg'){const cg=SymiaForgeView.cg(t,b.dataset.node);if(cg)modal(cg.title,cg.html);}return;}
    if(forgeActionBusy||storage.error)return;
    const types={'forge-start':'FORGE_START','forge-next':'FORGE_ADVANCE','forge-return':'FORGE_RETURN','forge-claim':'FORGE_CLAIM'};
    if(!types[action])return;
    if(action==='forge-start'){travelEnabled=true;page='world';travelPreparing=false;travelFootprints=false;travelCharactersOpen=false;}
    forgeActionBusy=true;syncForgeControls();
    try{await dispatch({type:types[action],packetId:b.dataset.packet||selectedPackage,journeyId:b.dataset.journey,expectedNode:b.dataset.node});}finally{forgeActionBusy=false;syncForgeControls();}
    if(action==='forge-claim'&&state.trip?.phase==='complete'){returnOpen=false;$('#modal').close();toast(SymiaForge.forTrip(state.trip).rewardId?'书签已收入背包，完整故事已收进旅行日记。':'见闻与完整故事已收进旅行日记。');}
    if(action==='forge-next'||action==='forge-start'){window.scrollTo({top:0,behavior:'instant'});}
    return;
  }
  if(action.startsWith('travel-')){await travelAction(action,b);return;}
  if(action==='world-select'){if(sliceBusy||busy){toast('当前故事正在整理，请稍后切换地图。');return;}closeDetail();await dispatch({type:'WORLD_SELECT',id:b.dataset.world});return;}
  if(action==='world-preview-next'){await dispatch({type:'WORLD_PREVIEW_NEXT',step:Number(b.dataset.step),route:b.dataset.route});return;}
  if(action==='world-preview-reset'){await dispatch({type:'WORLD_PREVIEW_RESET'});return;}
  if(action==='prepared-mode'){if(sliceBusy||busy)return;preparedMode=!preparedMode;try{localStorage.setItem('symia.expedition.prepared-mode',String(preparedMode));}catch{}render();tickSlice();return;}
  if(action.startsWith('slice-')){await handleSlice(action,b);return;}
  if(action.startsWith('garden-')){await handleGarden(action,b);return;}
  if(['world','home','memories','tasks'].includes(action)){navigate(action);return;}
  const types={start:'START',claim:'CLAIM',plant:'PLANT',harvest:'HARVEST',prepare:'PREPARE_TEA','begin-tea':'BEGIN_TEA','cancel-tea':'CANCEL_TEA',taste:'TASTE','greet-pet':'GREET_PET'};
  if(types[action]){review=null;await dispatch({type:types[action],...(action==='start'?{storyId:storyChoice,autonomous,seed:crypto.getRandomValues(new Uint32Array(1))[0]}: {})});if(action==='claim'){finishReturn();toast('发现已整理到家中，旅途回忆也已留下。');}if(action==='harvest'){homeTab='kitchen';render();toast('收获薄荷 ×3，可以做一壶茶了。');}if(action==='taste')toast('茶尝过了，这次共同经历已留下。');return;}
  switch(action){

case 'open-expedition-plan':
  modal('出发准备', SV.expeditionPanel(state, now(), sliceHelpers()));
  break;

case 'open-expedition-panel':
  modal('探索进度', SV.expeditionPanel(state, now(), sliceHelpers()));
  break;
    case 'task-tab':taskTab=b.dataset.tab;render();$(`[data-action="task-tab"][data-tab="${taskTab}"]`)?.focus();break;
    case 'task-journal':journalFocus=b.dataset.journey;navigate('memories');$(`[data-journey="${CSS.escape(journalFocus)}"]`)?.scrollIntoView({block:'start'});break;
    case 'battle-start':await dispatch({type:'BATTLE_START'});break;
    case 'battle-skip':await dispatch({type:'BATTLE_SKIP'});break;
    case 'battle-move':await dispatch({type:'BATTLE_ACTION',move:b.dataset.move,round:Number(b.dataset.round)});break;
    case 'battle-retreat':await dispatch({type:'BATTLE_RETREAT'});break;
    case 'inspect':await dispatch({type:'INSPECT',nodeId:b.dataset.node});if(live)talk();break;
    case 'choose':await dispatch({type:'CHOOSE',nodeId:b.dataset.node,choice:b.dataset.choice});if(travelActive()){closeDetail();render();}else if(live)talk();break;
    case 'next':{if(E.together(state.trip)){await continueJourney();break;}const i=E.currentNode(state,now());if(state.trip?.phase!=='exploring'||!state.trip.nodes[i].choice)break;const pose=V.routePose(mapState(),now());closeDetail();const target=Math.max(now(),E.nodeEnd(state.trip,i)-6000);departureView={node:i,at:target,from:pose.progress||0};await dispatch({type:'ADVANCE_DEMO',ms:Math.max(0,target-now())});break;}
    case 'compact-map':compactMap=!compactMap;render();break;
    case 'open-node':{if($('#modal').open) $('#modal').close();cancelArrival();const i=Number(b.dataset.index);if(!state.trip?.nodes[i]?.visited)break;detailIndex=i;review=i;clearReply();render();break;}
    case 'close-node':closeDetail();render();$('#main-content')?.focus({preventScroll:true});break;
    case 'offline':review=null;await dispatch({type:'ADVANCE_DEMO',ms:300000});toast(state.trip?.slice?'手动探索保留当前步骤，植物与心情时间继续推进。':state.trip?.battle?.status==='active'?'战斗回合已保留，回来后继续选择行动。':'已补算离线期间的行程，自动选择可在手记查看。');break;
    case 'grow':await dispatch({type:'ADVANCE_DEMO',ms:Math.max(0,state.home.plant.readyAt-now())});break;
    case 'finish-time':await dispatch({type:'ADVANCE_DEMO',ms:Math.max(0,state.kitchen.readyAt-now())});break;
    case 'method':await dispatch({type:'CHOOSE_TEA',method:b.dataset.method});break;
    case 'review':review=Number(b.dataset.index);clearReply();render();break;
    case 'present':cancelArrival();detailIndex=state.trip?.phase==='exploring'?E.currentNode(state,now()):null;review=detailIndex;clearReply();render();break;
    case 'tab':homeTab=b.dataset.tab;clearReply();render();break;
    case 'garden':homeTab='garden';navigate('home');break;
    case 'look-plant':homeTab='garden';render();break;
    case 'look-bottle':homeTab='map';render();break;
    case 'inventory':modal('行囊与厨房存量',inventoryHTML(state.inventory)+'<p class="hint">已备料的食材已预留；取消未开始的茶饮会退回。</p>');break;
    case 'settings':closeDetail();settings();break;
    case 'return-popup':returnPopup();break;
    case 'close':returnOpen=false;$('#modal').close();break;
    case 'check-connection':await dialogue.status();settings();break;
    case 'talk':talk();break;
    case 'export':download();break;
    case 'import':$('#import-file').click();break;
    case 'reset-confirm':modal('重置独立原型？','<p>清除本浏览器内的 V2 旅途、收获和回忆。可先导出保存；主项目和 V1 不受影响。</p><div class="button-row">'+button('先导出','export')+button('确认重置','reset','','primary')+'</div>');break;
    case 'reset':try{storage.error='';state=(await storage.transact(()=>E.createState(crypto.randomUUID?.()||`local-${Date.now()}`))).next;$('#modal').close();navigate('world');toast('已开始新的体验。');}catch{toast('浏览器不允许清除存档，请检查存储权限。');}break;
  }
  }catch{/* commitAction already reports errors; keep the current event open. */}
});
let pendingImport=null;
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>4000000)throw Error('文件过大，请选择 V2 JSON 存档。');const data=JSON.parse(await file.text()),s=data.state||data;if(!E.validateState(s))throw Error('这不是有效的 V2 存档。当前体验未被修改。');pendingImport=s;modal('替换当前体验？',`<p>将载入 ${s.tripCount} 次探访、${s.memories.length} 段回忆。此操作会替换当前 V2 存档。</p><div class="button-row">${button('取消','close')}${button('确认导入','confirm-import','','primary')}</div>`);}catch(err){toast(err.message);}});
document.addEventListener('click',async e=>{if(e.target.closest('[data-action="confirm-import"]')&&pendingImport){const imported=pendingImport;pendingImport=null;storage.error='';state=(await storage.transact(()=>E.transition(imported,{type:'TICK'},Date.now()+imported.clockOffsetMs))).next;$('#modal').close();navigate('world');toast('已导入并恢复时间进度。');}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [role="button"]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
await commitAction({type:travelEnabled?'ENABLE_TOGETHER':'TICK',journeyId:state.trip?.id}).catch(()=>{});render();
// Both dialog layers report visibility so host tools never cover a modal.
for(const dialog of [$('#node-detail'),$('#modal')])new MutationObserver(presentation).observe(dialog,{attributes:true,attributeFilter:['open']});
$('#node-detail').addEventListener('cancel',e=>{e.preventDefault();closeDetail();render();});
function visibleState(s){const copy=JSON.parse(JSON.stringify(s));if(copy.trip){delete copy.trip.delayMs;delete copy.trip.readingHold;if(copy.trip.pacing)delete copy.trip.pacing.progressFloor;if(copy.trip.battle)delete copy.trip.battle.updatedAt;}return JSON.stringify(copy);}
window.addEventListener('storage',event=>{if(event.key===storage.key&&refreshShared())render();});
setInterval(async()=>{
 if(document.hidden||tickBusy)return;tickBusy=true;
 try{
  const previous=state.trip,visible=visibleState(state);
  const upgrade=travelActive()&&state.trip?.phase==='exploring'&&!state.trip.auto&&!state.trip.slice&&!state.trip.forge&&!E.together(state.trip);
  await commitAction(upgrade?{type:'ENABLE_TOGETHER',journeyId:state.trip.id}:{type:'TICK',reading:slowReading&&detailIndex!==null&&detailIndex===E.currentNode(state,now())&&page==='world'&&!document.hidden});
  if(visibleState(state)!==visible&&previous?.battle?.status!=='active'){
   if(previous?.phase!==state.trip?.phase||JSON.stringify(previous?.nodes)!==JSON.stringify(state.trip?.nodes))clearReply();
   reconcileDetail(previous);render();
  }else clocks();
  updateOverview();updateTravel();travelPending();tickArrival();tickAutonomy();tickSlice();
 }catch{/* Saving failure is surfaced by commitAction; never publish unsaved progress. */}
 finally{tickBusy=false;}
},250);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelArrival();});
function animateTravel(time){
 const stage=$('[data-travel-stage]'),dt=travelMotion.last?time-travelMotion.last:0;travelMotion.last=time;
 if(stage){
  if(stage.hasAttribute('data-moon-pool-stage'))SymiaMoonPoolBackgrounds.frame(stage);
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,staticMode=stage.dataset.static==='true';
  if(!document.hidden&&dt>55)travelMotion.slow++;else travelMotion.slow=Math.max(0,travelMotion.slow-1);
  if(travelMotion.slow>90)travelMotion.degraded=true;
  stage.dataset.performance=travelMotion.degraded?'static':'normal';
  const walking=stage.dataset.state==='walking'&&!document.hidden&&!reduced&&!staticMode&&!travelMotion.degraded;
  if(walking)travelMotion.offset+=Math.min(dt,50)/12000*100;
  for(const layer of stage.querySelectorAll('[data-speed]'))layer.style.transform=`translateX(-${(travelMotion.offset*Number(layer.dataset.speed)%100)/2}%)`;
 }
 requestAnimationFrame(animateTravel);
}requestAnimationFrame(animateTravel);
function animateMap(){const svg=$('.world-svg');if(!document.hidden&&svg){const r=svg.getBoundingClientRect();const visible=!svg.closest('.travel-history-map')&&r.bottom>0&&r.top<innerHeight&&!$('#node-detail').open&&!$('#modal').open;svg.classList.toggle('motion-paused',!visible);if(visible)V.updateMap(svg,mapState(),now());}requestAnimationFrame(animateMap);}requestAnimationFrame(animateMap);
dialogue.status().then(ready=>{connectionChecked=true;if(ready&&new URLSearchParams(location.search).get('deepseek')==='on')live=true;render();tickSlice();});
if(embedded)window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==parent||event.data?.channel!=='symia-expedition-ui')return;
 if(event.data.kind==='settings'){settings();return;}
 if(event.data.kind==='diaries'){openTravelDiaries();return;}
 if(['world','tasks','memories','recap'].includes(event.data.view)){
   closeDetail();clearReply();page=episodeTest?'world':['recap','memories'].includes(event.data.view)?'world':event.data.view;review=null;render();if(event.data.view==='recap'){const t=state.trip?.forge?state.trip:state.history.find(t=>t.forge);if(t?.forge&&t.phase==='complete')modal('旅行日记',SymiaForgeView.archive(t));else returnPopup();}window.scrollTo(0,0);
 }
});
if(!episodeTest)SymiaProductionUI.init(render,id=>{selectedPackage=id;render();});
window.SymiaPrototype={getState:()=>JSON.parse(JSON.stringify(state)),dispatch,navigate,getNow:now};
})();

}
